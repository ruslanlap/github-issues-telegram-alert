services:
  - type: web
    name: github-telegram-notifier
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: notifier-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STATE_FILE
        value: /var/data/state.json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
